services:
  - type: web
    name: inboxpilot-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: WEB_ORIGIN
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
  - type: web
    name: inboxpilot-ml
    runtime: python
    rootDir: services/ml
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
  - type: web
    name: inboxpilot-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
